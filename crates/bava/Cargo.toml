[package]
name = "bava"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A cross-platform Bevy music visualizer driven by cavacore, with loopback capture and now-playing on Linux, Windows, macOS, and the web"
default-run = "bava"

[features]
# Native PipeWire capture backend (Linux). On by default; disable with
# `--no-default-features` to drop the libpipewire link on pure-PulseAudio hosts.
default = ["pipewire"]
pipewire = ["dep:pipewire"]
# Puffin instrumentation (`cargo run -p bava --features profile`). Turns on
# Bevy's `trace` feature (a `tracing` span around every system + render-graph
# node) and bridges those spans into puffin, so the whole schedule shows up in
# `puffin_viewer` without hand-instrumenting each system. Off by default: the
# span machinery costs a little even when idle, and `bevy/trace` pulls `tracing`
# into every system's hot path. See `src/profiling.rs`.
profile = [
    "bevy/trace",
    "dep:puffin",
    "dep:puffin_http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
cavacore-rs.workspace = true

# Bevy, tree-shaken to what a 2D visualizer actually touches. Default features
# pull in all of 3D (PBR/glTF/lighting/meshlets/anti-alias), the audio decoder
# stack, scene loading, and the picking backends — none of which we use. We opt
# into just the 2D + UI render pipelines (which transitively give the app/asset/
# window/text layers and HDR+bloom), windowing on Wayland/X11, and keyboard/mouse
# input. Adds back: 3D, `audio`, `scene`, `picking`, gamepad, sysinfo — if needed.
bevy = { version = "0.19", default-features = false, features = [
    "2d_bevy_render",  # sprite + core pipeline + post-process (bloom) + gizmos (avian F3 debug)
    "ui_bevy_render",  # bevy_ui for the HUD; transitively pulls default_app (asset/window/state/input_focus)
    "tonemapping_luts", # LUTs for the AgX / TonyMcMapface / BlenderFilmic tone mappers (see [vis] tonemapping)
    "std",
    "bevy_winit",
    "default_font",    # embedded font so HUD text renders without shipping one
    "keyboard",        # Space / F3 / configurable GUI toggle
    "mouse",           # egui editor interaction
] }

# 2D physics: ECS-native rigid bodies/colliders for the ball + bar simulation.
# Drop avian's default `bevy_scene` + `bevy_picking` (unused) and `xpbd_joints`
# (no joints); keep `debug-plugin` for the F3 collider gizmos.
avian2d = { version = "0.7", default-features = false, features = [
    "2d",
    "f32",
    "parry-f32",
    "debug-plugin",
] }

# Tiny, dep-free RNG for randomizing spawned ball properties.
fastrand = "2"

# In-app settings editor (immediate-mode GUI overlay). Drop egui's default
# `picking` (we have no bevy_picking backend) and `open_url` (no hyperlinks).
bevy_egui = { version = "0.41", default-features = false, features = [
    "render",
    "bevy_ui",
    "default_fonts",
    "manage_clipboard",
] }

# Album-art decoding (both platforms decode in-memory image bytes).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Dominant-color extraction from album art (modified median-cut quantization),
# for the dynamic color profile derived from the current track's cover.
color-thief = "0.2"

# Lock-free-ish hand-off from the audio/now-playing threads to Bevy systems.
crossbeam-channel = "0.5"

# --- Profiling (`--features profile`, see `src/profiling.rs`). ---
# All four are optional and reached only through the `profile` feature, so a
# default (or wasm) build never compiles them — which is why they can live in
# the platform-agnostic table despite puffin_http being a TCP server.
# The scope collector itself; its macros compile to an atomic load when scopes
# are off, so instrumented hot paths stay cheap.
puffin = { version = "0.20", optional = true }
# Serves the collected frames on 127.0.0.1:8585 for `puffin_viewer`.
puffin_http = { version = "0.17", optional = true }
# The bridge: a `tracing_subscriber::Layer` turning Bevy's per-system spans into
# puffin scopes, handed to `LogPlugin::custom_layer`.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "registry",
    "fmt",
] }

# Configuration: CLI args (clap) layered over a TOML config file. On the web
# build there is no command line, but the same `Cli` struct is still parsed —
# from the page's query string — so both targets share one override path.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

# --- Native-only: everything that assumes an OS (threads, a filesystem, a
# subprocess to pipe video into). The web build drops all of it: see
# `cava::capture::web`, `now_playing::web`, and `config`'s localStorage store. ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Rendering and physics across cores. wasm32-unknown-unknown is single-threaded
# (no shared-memory atomics in the shipped build), and enabling these there makes
# Bevy's task pools spawn threads the browser can't provide.
bevy = { version = "0.19", default-features = false, features = [
    "multi_threaded",
    "wayland",
    "x11",
] }
avian2d = { version = "0.7", default-features = false, features = ["parallel"] }

# Offline video rendering (`--input song.mp3 --out video.mp4`): GPU→CPU frame
# readback from a headless render target. We implement its `Encoder` trait over
# an ffmpeg subprocess (see `record::encoder`) instead of enabling its built-in
# encoder features, so video encode + audio mux happen in one streaming pass.
bevy_capture = "0.6"

# Audio-file decoding for offline rendering (pure Rust). The defaults cover
# flac/ogg/vorbis/wav/pcm; mp3 + m4a/aac are added on top.
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }

# `~/.config/bava` resolution. No filesystem in the browser, where the config
# store is `window.localStorage` instead.
dirs = "6"

# --- Web build (`wasm32-unknown-unknown`, see `web/` and `docs/WEB.md`).
# Audio comes from a tab-share `MediaStream` the page pushes in through
# `bava_push_audio`; there is no capture thread and no filesystem. ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `webgl2` targets WebGL2, which every current browser has; `webgpu` would be
# faster but is still Chrome/Edge-desktop-only. `web` routes `Instant`,
# `bevy_app`'s runner, and reflect's type registry through the browser
# equivalents (`performance.now`, `requestAnimationFrame`). `zstd_rust` swaps
# the C zstd used to decompress the tonemapping LUTs for the pure-Rust decoder.
bevy = { version = "0.19", default-features = false, features = [
    "web",
    "webgl2",
    "zstd_rust",
] }

# The JS bridge: `bava_push_audio` / `bava_set_now_playing` are called from
# `web/bava.js`, and the config store reaches `window.localStorage`.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "console"] }
# Route Rust panics to the devtools console with a stack trace instead of the
# bare "unreachable executed" the runtime would otherwise show.
console_error_panic_hook = "0.1"
#
# No `getrandom` entry is needed: the only thing that reaches it on wasm is
# bevy_egui, which already enables `getrandom/wasm_js` for this target — and
# getrandom 0.4 picks that backend from the feature alone, without the
# `--cfg getrandom_backend=…` rustflag its 0.3 line required.

# --- Linux backends: PulseAudio capture + MPRIS now-playing over D-Bus. ---
[target.'cfg(target_os = "linux")'.dependencies]
# Audio capture (PulseAudio simple API, works through pipewire-pulse). Always
# compiled: the universal fallback when the native PipeWire backend is disabled
# or fails to connect.
libpulse-binding = "2"
libpulse-simple-binding = "2"
# Native PipeWire capture (default-on). Follows the default sink's monitor via
# the graph (PW_KEY_STREAM_CAPTURE_SINK + autoconnect) and negotiates format,
# which the pipewire-pulse compatibility path can't. Optional + linked only with
# the `pipewire` feature so a `--no-default-features` build stays free of the
# libpipewire link for pure-PulseAudio systems.
# `v0_3_44` unlocks PW_KEY_TARGET_OBJECT (for pinning an explicit capture node);
# the runtime libpipewire is far newer, so the gate is purely a min-version marker.
pipewire = { version = "0.10", optional = true, features = ["v0_3_44"] }
# Now-playing metadata + album art over MPRIS / D-Bus.
mpris = "2"
# HTTP fetch for remote album art (e.g. spotifyd's http artUrl).
ureq = "3"
# Decode `data:…;base64,…` artUrls (jellyfin-desktop embeds the cover inline).
base64 = "0.23"

# --- Windows backends: WASAPI loopback capture + GSMTC now-playing. ---
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

# --- macOS backends: Core Audio process-tap capture + mediaremote-adapter
# now-playing. The objc2-* crates are the safe-Rust bindings to the CoreAudio /
# Foundation frameworks; process taps need macOS 14.2+. The adapter is driven as
# a subprocess emitting JSON (serde_json) with base64 album art (base64). ---
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Parse the mediaremote-adapter JSON stream + its base64 `artworkData`.
serde_json = "1"
base64 = "0.23"
# CoreAudio bindings: process taps, aggregate devices, IO procs. `AudioHardware`
# turns on the CFDictionary-based aggregate-device API; the default features
# already enable objc2 + objc2-foundation + objc2-core-audio-types + block2.
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
# Foundation collections used to describe the tap + aggregate device.
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSValue",
    "NSObject",
] }
# CoreFoundation types the CoreAudio property/aggregate APIs hand back / expect.
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFString",
    "CFDictionary",
] }

# --- Debian/Ubuntu package (`cargo deb -p bava`) ---------------------------
# Ships the same four files the AUR and Flatpak packages do. `$auto` lets
# cargo-deb read the built ELF and derive the shared-library dependencies
# (libpulse, libpipewire, libdbus, wayland, X11, vulkan-loader …) from the
# build host's package database, so the list can't drift from what we link.
[package.metadata.deb]
name = "bava"
maintainer = "dekuraan <declan.li.carney@gmail.com>"
copyright = "2026 dekuraan"
license-file = "../../LICENSE-MIT"
extended-description = """
A music visualizer built on the Bevy engine. Captures the default audio \
output's monitor through PipeWire (or PulseAudio), runs it through cavacore \
— the analysis engine from CAVA — and renders smoothed, log-spaced frequency \
bars with HDR bloom. Reads now-playing metadata and album art over MPRIS."""
section = "sound"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg"
assets = [
    ["target/release/bava", "usr/bin/", "755"],
    ["../../flatpak/io.github.dekuraan.bava.desktop", "usr/share/applications/", "644"],
    ["../../flatpak/io.github.dekuraan.bava.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../flatpak/io.github.dekuraan.bava.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../README.md", "usr/share/doc/bava/README.md", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/bava/LICENSE-APACHE", "644"],
]

# --- Fedora/openSUSE package (`cargo generate-rpm -p crates/bava`) ---------
# auto-req is on by default: cargo-generate-rpm runs the same ELF scan rpmbuild
# would, so Requires: comes out of the binary rather than a hand-kept list.
[package.metadata.generate-rpm]
name = "bava"
summary = "Music visualizer driven by cavacore, MPRIS, and PipeWire/PulseAudio"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/bava", dest = "/usr/bin/bava", mode = "755" },
    { source = "flatpak/io.github.dekuraan.bava.desktop", dest = "/usr/share/applications/io.github.dekuraan.bava.desktop", mode = "644" },
    { source = "flatpak/io.github.dekuraan.bava.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.dekuraan.bava.svg", mode = "644" },
    { source = "flatpak/io.github.dekuraan.bava.metainfo.xml", dest = "/usr/share/metainfo/io.github.dekuraan.bava.metainfo.xml", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/bava/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/bava/LICENSE-APACHE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/bava/README.md", mode = "644", doc = true },
]
