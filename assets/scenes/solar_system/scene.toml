[[object]]
mesh = "ring"
size = [70.0, 44.0]
position = [0.0, 0.0, 2.2]
scale = [1.0, 0.3, 1.0]
material = { shader = "rings", color = "#e8d6a8", params = [[0.55, 0.45, 0.32, 0.0], [-1.0, 0.7, 0.0, 0.0]] }
