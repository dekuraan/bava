# ----------------------------------------------------------- asteroid belt --
# 96 rocks between Mars and Jupiter; each swells with its own spectrum bar.
[[ring]]
count = 96
radius = [548.0, 230.0]
spin = 4.0
behind_z = -7.6
perspective = 0.18
face_out = false
template = { mesh = "circle", size = [3.2], position = [0.0, 0.0, 1.5], material = { color = "#b9a48a" }, react = [{ property = "scale", band = "bar", amount = 1.6, smooth = 0.12 }] }
