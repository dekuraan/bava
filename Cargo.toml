[workspace]
resolver = "3"
members = [
    "crates/cavacore-rs",
    "crates/bava",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekuraan/bava"

[workspace.dependencies]
cavacore-rs = { path = "crates/cavacore-rs" }

# Compile dependencies with optimizations even in dev builds; Bevy is unusably
# slow otherwise. Our own crates stay unoptimized for fast iteration.
[profile.dev.package."*"]
opt-level = 3

# Smaller release binaries: cross-crate inlining + dead-code elimination (LTO),
# a single codegen unit, and stripped symbols. Slower to link, much smaller out.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# For `cargo run --profile profiling --features profile`: release-grade codegen
# (dev's opt-level 0 on our own crates would make every measurement meaningless)
# but without release's LTO + single codegen unit, which relink the whole binary
# on each edit and make A/B iteration painful. Symbols are kept so an external
# sampling profiler (perf, samply) can resolve frames alongside puffin's scopes.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = "line-tables-only"
